kind = "web"
previewPath = "/"
title = "Unisex Salon By Nidhi"
description = "A premium responsive salon website for Unisex Salon By Nidhi in Jaipur, with service discovery, gallery browsing, reviews, contact details, and appointment booking actions."
version = "1.0.0"
id = "artifacts/unisex-salon-by-nidhi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23006

[services.development]
run = "pnpm --filter @workspace/unisex-salon-by-nidhi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/unisex-salon-by-nidhi", "run", "build" ]
serve = "static"
publicDir = "artifacts/unisex-salon-by-nidhi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23006"
BASE_PATH = "/"
